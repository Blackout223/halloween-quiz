<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Haunted Pub Quiz</title>
  <meta name="description" content="A Halloween pub quiz for hosts: rounds, answer reveals and printable sheets.">
  <meta name="theme-color" content="#0e0a16">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Creepster&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to quiz</a>

  <!-- Decorative background: moon, fog and bats (hidden from assistive tech) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="bat" viewBox="0 0 64 30">
      <path d="M32 26C34 22 38 20 42 22C44 18 48 17 51 19C53 15 57 13 62 14C58 10 52 7 46 9C42 10 38 11 36 12L35 7L33 10L31 10L29 7L28 12C26 11 22 10 18 9C12 7 6 10 2 14C7 13 11 15 13 19C16 17 20 18 22 22C26 20 30 22 32 26Z"/>
    </symbol>
  </svg>
  <div class="fx" aria-hidden="true">
    <div class="moon"></div>
    <div class="fog fog-1"></div>
    <div class="fog fog-2"></div>
    <div class="bat-path b1"><svg class="bat"><use href="#bat"/></svg></div>
    <div class="bat-path b2"><svg class="bat"><use href="#bat"/></svg></div>
    <div class="bat-path b3"><svg class="bat"><use href="#bat"/></svg></div>
    <div class="bat-path b4"><svg class="bat"><use href="#bat"/></svg></div>
    <!-- Anime-flavoured floaters (emoji only, no character artwork) -->
    <span class="floater f1">👹</span>
    <span class="floater f2">⚡</span>
    <span class="floater f3">⚔️</span>
    <span class="floater f4">🦊</span>
    <span class="floater f5">🌀</span>
    <span class="floater f6">👺</span>
    <span class="floater f7">🔥</span>
    <span class="floater f8">👻</span>
  </div>

  <header class="site-header">
    <div class="brand">
      <svg class="candle" viewBox="0 0 40 80" aria-hidden="true" focusable="false">
        <ellipse class="candle-glow" cx="20" cy="22" rx="18" ry="20"/>
        <path class="candle-flame" d="M20 6C24 14 27 19 27 24C27 29 24 32 20 32C16 32 13 29 13 24C13 19 16 14 20 6Z"/>
        <path class="candle-core" d="M20 18C22 22 23 24 23 26C23 28 22 30 20 30C18 30 17 28 17 26C17 24 18 22 20 18Z"/>
        <line x1="20" y1="30" x2="20" y2="36" stroke="#2b2230" stroke-width="2"/>
        <rect class="candle-wax" x="11" y="35" width="18" height="40" rx="3"/>
        <path class="candle-drip" d="M11 38h18v4c-2 0-2 6-4 6s-2-4-4-4-2 8-4 8-2-6-4-6z"/>
      </svg>
      <h1 class="logo">The Haunted Pub Quiz</h1>
    </div>
    <div class="header-actions" role="group" aria-label="Host controls">
      <button type="button" class="btn btn-small btn-ghost" data-action="switchRole" id="role-btn" hidden>⇄ Host / Quizzer</button>
      <button type="button" class="btn btn-small btn-ghost" data-action="fullscreen" id="fullscreen-btn" aria-keyshortcuts="F">⛶ Fullscreen</button>
      <button type="button" class="btn btn-small btn-ghost" data-action="newGame" id="new-game-btn" hidden>↺ New game</button>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <noscript><p class="panel">This quiz needs JavaScript turned on.</p></noscript>
  </main>

  <footer class="site-footer">
    <p class="keys"><span class="sr-only">Keyboard shortcuts:</span>
      <kbd>←</kbd> <kbd>→</kbd> move · <kbd>R</kbd> reveal answers · <kbd>F</kbd> fullscreen
    </p>
  </footer>

  <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
  <div id="print-root"></div>

  <!-- PeerJS connects quizzers' phones to the host; qrcode.js draws the join QR code.
       Questions (data/questions.js) are loaded by app.js on the host's device only. -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
